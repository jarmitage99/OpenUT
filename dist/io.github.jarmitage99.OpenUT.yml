app-id: io.github.jarmitage99.OpenUT
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: openut
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=home:ro

modules:
  - name: openut
    buildsystem: simple
    sources:
      - type: dir
        path: ..
    build-commands:
      - cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSKIP_QA=ON -DSKIP_UT=ON
      - cmake --build build --parallel ${FLATPAK_BUILDER_N_JOBS}
      - install -Dm755 build/bin/openut /app/bin/openut
      - install -Dm755 build/bin/openut-editor /app/bin/openut-editor
      - install -Dm755 build/bin/ucc /app/bin/ucc
      - install -Dm644 dist/io.github.jarmitage99.OpenUT.desktop /app/share/applications/io.github.jarmitage99.OpenUT.desktop
      - install -Dm644 dist/io.github.jarmitage99.OpenUT.metainfo.xml /app/share/metainfo/io.github.jarmitage99.OpenUT.metainfo.xml
      - install -Dm644 dist/io.github.jarmitage99.OpenUT.png /app/share/icons/hicolor/64x64/apps/io.github.jarmitage99.OpenUT.png
